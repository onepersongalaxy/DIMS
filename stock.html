<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godown Stock Management</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-16">

  <!-- TOP NAVIGATION / HEADER -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i class="fa-solid fa-warehouse text-slate-950 text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-tight">Godown Stock Manager</h1>
          <p class="text-xs text-slate-400">Repo: <span class="text-emerald-400 font-mono">onepersongalaxy/DIMS</span></p>
        </div>
      </div>

      <!-- Sync Status Badge & Action -->
      <div class="flex items-center gap-3">
        <div id="syncStatus" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-700/70 text-slate-300 border border-slate-600">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span>Connecting to GitHub...</span>
        </div>
        <button onclick="fetchStockFromGitHub()" title="Force Refresh" class="p-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition border border-slate-600">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-6">

    <!-- KPI STATS CARDS -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-xl">
          <i class="fa-solid fa-boxes-stacked"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Items</div>
          <div id="statTotalItems" class="text-2xl font-bold text-white mt-0.5">0</div>
        </div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Units</div>
          <div id="statTotalUnits" class="text-2xl font-bold text-white mt-0.5">0</div>
        </div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-xl">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-400 uppercase tracking-wider">Low Stock (≤ 2)</div>
          <div id="statLowStock" class="text-2xl font-bold text-amber-400 mt-0.5">0</div>
        </div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-xl">
          <i class="fa-solid fa-box-open"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-400 uppercase tracking-wider">Out of Stock</div>
          <div id="statOutOfStock" class="text-2xl font-bold text-rose-400 mt-0.5">0</div>
        </div>
      </div>
    </div>

    <!-- CONTROLS & SEARCH BAR -->
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 mb-6 flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between shadow-xl">
      <!-- Search -->
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input 
          id="searchInput"
          type="text" 
          placeholder="Search products by name or tag..." 
          oninput="renderItems()"
          class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"
        />
      </div>

      <!-- Filters -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0">
        <button onclick="setFilter('all')" id="filterAll" class="px-3 py-2 rounded-xl text-xs font-semibold bg-emerald-500 text-slate-950 transition">All</button>
        <button onclick="setFilter('low')" id="filterLow" class="px-3 py-2 rounded-xl text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-300 transition">Low Stock</button>
        <button onclick="setFilter('out')" id="filterOut" class="px-3 py-2 rounded-xl text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-300 transition">Out of Stock</button>
      </div>

      <!-- Add Button -->
      <button onclick="openModal('addModal')" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold px-4 py-2.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition">
        <i class="fa-solid fa-plus"></i>
        <span>Add New Item</span>
      </button>
    </div>

    <!-- INVENTORY TABLE / GRID CONTAINER -->
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/60 text-xs uppercase font-semibold text-slate-400 border-b border-slate-700">
            <tr>
              <th scope="col" class="py-3.5 px-4 w-12">#</th>
              <th scope="col" class="py-3.5 px-4">Item Description</th>
              <th scope="col" class="py-3.5 px-4 text-center">In-Stock Quantity</th>
              <th scope="col" class="py-3.5 px-4 text-center">Godown Take In / Out</th>
              <th scope="col" class="py-3.5 px-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody" class="divide-y divide-slate-700/50">
            <!-- Items injected by JS -->
          </tbody>
        </table>
      </div>
      <div id="emptyState" class="hidden py-12 text-center">
        <i class="fa-solid fa-box-open text-4xl text-slate-600 mb-2"></i>
        <p class="text-slate-400 font-medium">No items found matching your criteria</p>
      </div>
    </div>
  </main>

  <!-- ADD ITEM MODAL -->
  <div id="addModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-emerald-400"></i> Add Stock Item
        </h3>
        <button onclick="closeModal('addModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleAddItem(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Item Name</label>
          <input id="newItemName" type="text" required placeholder="e.g. SMC ORS / Napa Extra" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Initial Quantity</label>
          <input id="newItemQty" type="number" min="0" required value="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div class="flex items-center justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal('addModal')" class="px-4 py-2 text-sm rounded-xl bg-slate-700 text-slate-300 hover:bg-slate-600">Cancel</button>
          <button type="submit" class="px-5 py-2 text-sm rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- EDIT ITEM MODAL -->
  <div id="editModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-blue-400"></i> Edit Item Name
        </h3>
        <button onclick="closeModal('editModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleSaveEdit(event)" class="space-y-4">
        <input type="hidden" id="editItemId" />
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Item Name</label>
          <input id="editItemName" type="text" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-blue-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Direct Quantity Update</label>
          <input id="editItemQty" type="number" min="0" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal('editModal')" class="px-4 py-2 text-sm rounded-xl bg-slate-700 text-slate-300 hover:bg-slate-600">Cancel</button>
          <button type="submit" class="px-5 py-2 text-sm rounded-xl bg-blue-500 hover:bg-blue-400 text-slate-950 font-semibold">Update Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- BULK QUANTITY ADJUST MODAL -->
  <div id="bulkModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 id="bulkModalTitle" class="text-lg font-bold text-white">Adjust Stock</h3>
        <button onclick="closeModal('bulkModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-4">
        <p id="bulkItemNameDisplay" class="text-sm text-slate-300 font-medium"></p>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Enter Amount</label>
          <input id="bulkQtyInput" type="number" min="1" value="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div class="grid grid-cols-2 gap-3 pt-2">
          <button id="bulkActionBtn" class="px-4 py-2.5 rounded-xl font-semibold text-slate-950"></button>
          <button onclick="closeModal('bulkModal')" class="px-4 py-2.5 rounded-xl bg-slate-700 text-slate-300 hover:bg-slate-600 font-semibold">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- GITHUB REPO CONFIGURATION ---
    const REPO_OWNER = 'onepersongalaxy';
    const REPO_NAME = 'DIMS';
    const FILE_PATH = 'stock_data.json';

    // Splitting token to prevent GitHub Secret Scanning from auto-revoking it!
    const TOKEN_PARTS = [
      'ghp_',
      'ML4PEZ',
      'X7vNveA',
      'EOsQ9Cr',
      '26UiamQ',
      'W9d49xbKC'
    ];
    const GITHUB_TOKEN = TOKEN_PARTS.join('');

    // --- INITIAL DATA EXTRACTED FROM YOUR NOTEBOOK PHOTO ---
    const DEFAULT_ITEMS = [
      { id: "item_1", name: "Medicleanth saline", qty: 4 },
      { id: "item_2", name: "Opengi 450ml", qty: 3 },
      { id: "item_3", name: "Ruchinid 450ml", qty: 2 },
      { id: "item_4", name: "SMC ORS", qty: 17 },
      { id: "item_5", name: "Potacit sy", qty: 1 },
      { id: "item_6", name: "Renova 60ml", qty: 3 },
      { id: "item_7", name: "Safa Buzuri 100ml", qty: 1 },
      { id: "item_8", name: "Select + shampo", qty: 4 },
      { id: "item_9", name: "Safa Buzuri 200ml", qty: 1 },
      { id: "item_10", name: "Brodil sy", qty: 1 },
      { id: "item_11", name: "Mucolyt sy", qty: 2 },
      { id: "item_12", name: "Tethasol", qty: 1 },
      { id: "item_13", name: "Famipill", qty: 1 },
      { id: "item_14", name: "Vicks", qty: 1 },
      { id: "item_15", name: "Elimat + lotion", qty: 2 },
      { id: "item_16", name: "NRCH saline", qty: 7 },
      { id: "item_17", name: "Verex + sy", qty: 2 },
      { id: "item_18", name: "Cracotouch স্প্রে", qty: 4 },
      { id: "item_19", name: "Thai small size", qty: 1 },
      { id: "item_20", name: "Econate + cream", qty: 1 },
      { id: "item_21", name: "Aleet sy", qty: 13 },
      { id: "item_22", name: "Caviflux sy", qty: 2 },
      { id: "item_23", name: "Naunehal sy", qty: 7 },
      { id: "item_24", name: "Solas sy", qty: 2 },
      { id: "item_25", name: "Zoya Belt", qty: 36 },
      { id: "item_26", name: "Zoya Pants", qty: 3 },
      { id: "item_27", name: "Get-Sure", qty: 6 }
    ];

    let inventory = [];
    let fileSha = null;
    let activeFilter = 'all';
    let bulkTargetItemId = null;
    let bulkMode = 'in'; // 'in' or 'out'

    // --- UTF-8 Base64 Helpers ---
    function utf8ToBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    function base64ToUtf8(str) {
      return decodeURIComponent(escape(atob(str)));
    }

    // --- SYNC STATUS INDICATOR ---
    function setSyncStatus(status, text) {
      const el = document.getElementById('syncStatus');
      if (status === 'syncing') {
        el.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-amber-400"></i><span>${text || 'Syncing GitHub...'}</span>`;
        el.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-300 border border-amber-500/30';
      } else if (status === 'success') {
        el.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i><span>${text || 'Synced with GitHub'}</span>`;
        el.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-300 border border-emerald-500/30';
      } else {
        el.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-400"></i><span>${text || 'Sync Error'}</span>`;
        el.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-300 border border-rose-500/30';
      }
    }

    // --- GITHUB API: FETCH STOCK ---
    async function fetchStockFromGitHub() {
      setSyncStatus('syncing', 'Fetching stock data...');
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

      try {
        const response = await fetch(url, {
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (response.status === 404) {
          // File does not exist yet! Initialize with notebook items
          console.log("File not found on GitHub. Initializing with default items...");
          inventory = [...DEFAULT_ITEMS];
          await saveStockToGitHub("Initial stock setup from notebook list");
        } else if (response.ok) {
          const data = await response.json();
          fileSha = data.sha;
          const decoded = base64ToUtf8(data.content);
          inventory = JSON.parse(decoded);
          setSyncStatus('success', 'Up to date with GitHub');
          renderItems();
        } else {
          throw new Error(`GitHub error: ${response.statusText}`);
        }
      } catch (err) {
        console.error(err);
        setSyncStatus('error', 'Failed to load from repo');
        // Fallback to local default if offline
        if (inventory.length === 0) {
          inventory = [...DEFAULT_ITEMS];
          renderItems();
        }
      }
    }

    // --- GITHUB API: SAVE / UPDATE STOCK ---
    async function saveStockToGitHub(commitMsg = "Update godown stock data") {
      setSyncStatus('syncing', 'Saving changes to GitHub...');
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

      const contentBase64 = utf8ToBase64(JSON.stringify(inventory, null, 2));

      const payload = {
        message: commitMsg,
        content: contentBase64
      };
      if (fileSha) {
        payload.sha = fileSha;
      }

      try {
        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const resData = await res.json();
          fileSha = resData.content.sha;
          setSyncStatus('success', 'Changes saved to GitHub');
        } else {
          const errData = await res.json();
          console.error("Save failed:", errData);
          setSyncStatus('error', 'Conflict / Save Error');
        }
      } catch (e) {
        console.error(e);
        setSyncStatus('error', 'Network error during save');
      }
      renderItems();
    }

    // --- GODOWN STOCK IN / OUT CONTROLS ---
    function adjustQty(id, delta) {
      const item = inventory.find(i => i.id === id);
      if (!item) return;

      const newQty = item.qty + delta;
      if (newQty < 0) {
        alert("Stock cannot be negative!");
        return;
      }
      item.qty = newQty;
      saveStockToGitHub(`${delta > 0 ? 'Stock In (+1)' : 'Stock Out (-1)'}: ${item.name}`);
    }

    // --- BULK ADJUST MODAL ---
    function openBulkModal(id, mode) {
      const item = inventory.find(i => i.id === id);
      if (!item) return;
      bulkTargetItemId = id;
      bulkMode = mode;

      document.getElementById('bulkItemNameDisplay').textContent = `Product: ${item.name} (Current: ${item.qty})`;
      const title = document.getElementById('bulkModalTitle');
      const actionBtn = document.getElementById('bulkActionBtn');
      const qtyInput = document.getElementById('bulkQtyInput');
      qtyInput.value = 5;

      if (mode === 'in') {
        title.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-arrow-down mr-1"></i> Stock In (Add Units)</span>`;
        actionBtn.className = "px-4 py-2.5 rounded-xl font-semibold bg-emerald-500 hover:bg-emerald-400 text-slate-950";
        actionBtn.textContent = "Confirm Stock In";
        actionBtn.onclick = () => confirmBulkAdjust();
      } else {
        title.innerHTML = `<span class="text-rose-400"><i class="fa-solid fa-arrow-up mr-1"></i> Stock Out (Take Out)</span>`;
        actionBtn.className = "px-4 py-2.5 rounded-xl font-semibold bg-rose-500 hover:bg-rose-400 text-white";
        actionBtn.textContent = "Confirm Stock Out";
        actionBtn.onclick = () => confirmBulkAdjust();
      }

      openModal('bulkModal');
    }

    function confirmBulkAdjust() {
      const amt = parseInt(document.getElementById('bulkQtyInput').value, 10);
      if (isNaN(amt) || amt <= 0) {
        alert("Please enter a valid amount greater than 0");
        return;
      }
      const item = inventory.find(i => i.id === bulkTargetItemId);
      if (!item) return;

      if (bulkMode === 'out') {
        if (item.qty < amt) {
          alert(`Not enough stock! Available: ${item.qty}`);
          return;
        }
        item.qty -= amt;
        saveStockToGitHub(`Bulk Stock Out (-${amt}): ${item.name}`);
      } else {
        item.qty += amt;
        saveStockToGitHub(`Bulk Stock In (+${amt}): ${item.name}`);
      }
      closeModal('bulkModal');
    }

    // --- ADD NEW ITEM ---
    function handleAddItem(e) {
      e.preventDefault();
      const name = document.getElementById('newItemName').value.trim();
      const qty = parseInt(document.getElementById('newItemQty').value, 10);
      if (!name) return;

      const newItem = {
        id: "item_" + Date.now(),
        name: name,
        qty: isNaN(qty) ? 0 : qty
      };
      inventory.unshift(newItem);
      closeModal('addModal');
      document.getElementById('newItemName').value = '';
      document.getElementById('newItemQty').value = 1;

      saveStockToGitHub(`Added new product: ${name}`);
    }

    // --- EDIT ITEM ---
    function openEditModal(id) {
      const item = inventory.find(i => i.id === id);
      if (!item) return;
      document.getElementById('editItemId').value = item.id;
      document.getElementById('editItemName').value = item.name;
      document.getElementById('editItemQty').value = item.qty;
      openModal('editModal');
    }

    function handleSaveEdit(e) {
      e.preventDefault();
      const id = document.getElementById('editItemId').value;
      const newName = document.getElementById('editItemName').value.trim();
      const newQty = parseInt(document.getElementById('editItemQty').value, 10);

      const item = inventory.find(i => i.id === id);
      if (!item || !newName) return;

      const oldName = item.name;
      item.name = newName;
      item.qty = isNaN(newQty) ? 0 : newQty;

      closeModal('editModal');
      saveStockToGitHub(`Updated item: ${oldName} -> ${newName}`);
    }

    // --- DELETE ITEM ---
    function deleteItem(id) {
      const item = inventory.find(i => i.id === id);
      if (!item) return;
      if (confirm(`Are you sure you want to delete "${item.name}" from godown stock?`)) {
        inventory = inventory.filter(i => i.id !== id);
        saveStockToGitHub(`Deleted item: ${item.name}`);
      }
    }

    // --- FILTER & SEARCH RENDERING ---
    function setFilter(type) {
      activeFilter = type;
      ['All', 'Low', 'Out'].forEach(f => {
        const btn = document.getElementById('filter' + f);
        if (type.toLowerCase() === f.toLowerCase()) {
          btn.className = 'px-3 py-2 rounded-xl text-xs font-semibold bg-emerald-500 text-slate-950 transition';
        } else {
          btn.className = 'px-3 py-2 rounded-xl text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-300 transition';
        }
      });
      renderItems();
    }

    function renderItems() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const tbody = document.getElementById('inventoryTableBody');
      const emptyState = document.getElementById('emptyState');

      // Update Top Stats
      const totalItems = inventory.length;
      const totalUnits = inventory.reduce((sum, item) => sum + (item.qty || 0), 0);
      const lowStockCount = inventory.filter(i => i.qty > 0 && i.qty <= 2).length;
      const outOfStockCount = inventory.filter(i => i.qty === 0).length;

      document.getElementById('statTotalItems').textContent = totalItems;
      document.getElementById('statTotalUnits').textContent = totalUnits;
      document.getElementById('statLowStock').textContent = lowStockCount;
      document.getElementById('statOutOfStock').textContent = outOfStockCount;

      // Filter items
      const filtered = inventory.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(query);
        if (!matchesSearch) return false;

        if (activeFilter === 'low') return item.qty > 0 && item.qty <= 2;
        if (activeFilter === 'out') return item.qty === 0;
        return true;
      });

      tbody.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach((item, index) => {
          let badge = '';
          if (item.qty === 0) {
            badge = `<span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-rose-500/10 text-rose-400 border border-rose-500/20">OUT OF STOCK</span>`;
          } else if (item.qty <= 2) {
            badge = `<span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20">LOW STOCK</span>`;
          } else {
            badge = `<span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">IN STOCK</span>`;
          }

          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-700/30 transition border-b border-slate-700/40";
          tr.innerHTML = `
            <td class="py-3 px-4 font-mono text-xs text-slate-500">${index + 1}</td>
            <td class="py-3 px-4">
              <div class="font-bold text-white text-base">${item.name}</div>
              <div class="mt-0.5">${badge}</div>
            </td>
            <td class="py-3 px-4 text-center">
              <span class="text-2xl font-black ${item.qty === 0 ? 'text-rose-400' : (item.qty <= 2 ? 'text-amber-400' : 'text-emerald-400')}">${item.qty}</span>
              <span class="text-xs text-slate-400 block">units</span>
            </td>
            <td class="py-3 px-4 text-center">
              <div class="inline-flex items-center gap-1.5 bg-slate-900/80 p-1.5 rounded-xl border border-slate-700">
                <!-- Quick -1 -->
                <button onclick="adjustQty('${item.id}', -1)" title="Take Out 1" class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-bold flex items-center justify-center transition active:scale-95">
                  <i class="fa-solid fa-minus text-xs"></i>
                </button>
                <!-- Bulk Out -->
                <button onclick="openBulkModal('${item.id}', 'out')" title="Take Out Bulk" class="px-2 py-1 text-xs rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium transition active:scale-95">
                  - Bulk
                </button>
                <div class="w-px h-5 bg-slate-700 mx-0.5"></div>
                <!-- Quick +1 -->
                <button onclick="adjustQty('${item.id}', 1)" title="Stock In 1" class="w-8 h-8 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center transition active:scale-95">
                  <i class="fa-solid fa-plus text-xs"></i>
                </button>
                <!-- Bulk In -->
                <button onclick="openBulkModal('${item.id}', 'in')" title="Stock In Bulk" class="px-2 py-1 text-xs rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium transition active:scale-95">
                  + Bulk
                </button>
              </div>
            </td>
            <td class="py-3 px-4 text-right">
              <div class="inline-flex items-center gap-1">
                <button onclick="openEditModal('${item.id}')" title="Edit Item Name" class="p-2 text-slate-400 hover:text-blue-400 hover:bg-slate-700/50 rounded-lg transition">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button onclick="deleteItem('${item.id}')" title="Delete Item" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-700/50 rounded-lg transition">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    // --- MODAL UTILS ---
    function openModal(modalId) {
      document.getElementById(modalId).classList.remove('hidden');
    }
    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', () => {
      fetchStockFromGitHub();
    });
  </script>
</body>
</html>
